<text x="448" y="568" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Jan 2026</text>
<line x1="624" y1="128" x2="624" y2="546" stroke="#E8E8E8" stroke-width="1"/>
<text x="624" y="568" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Jul 2026</text>
