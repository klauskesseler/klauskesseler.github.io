<rect x="116" y="152" width="560" height="104" fill="#F7F7F7"/>
<rect x="116" y="152" width="5" height="104" fill="#E6007C"/>
<text x="136" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Which open model sits on that line</text>
<circle cx="143" cy="196" r="5" fill="#E6007C"/>
<text x="158" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A1A1A"><tspan font-weight="700">320B class — 1 node per replica.</tspan> About $370k of GPU.</text>
<circle cx="143" cy="220" r="5" fill="none" stroke="#E6007C" stroke-width="2"/>
<text x="158" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A1A1A">Largest open model — ~2.8T class, 5 nodes per replica. <tspan font-weight="700">About $1.85M.</tspan></text>
<text x="136" y="246" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A5A5A">One line, not two: on the only index version where they compare, the 320B scored <tspan font-weight="700">above</tspan> the 2.4T and 1.6T models.</text>
<rect x="96" y="594" width="6" height="50" fill="#E6007C"/>
<text x="114" y="618" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">Even with the gap widening, open weights reach today&#8217;s frontier around the middle of 2027.</text>
<text x="114" y="638" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5A5A5A">Lag modelled at its measured rate of growth — +1 month of lag per 7 months elapsed. If it accelerates beyond that, the date slips.</text>
</svg>
