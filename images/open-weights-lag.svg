<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 672" width="100%" style="max-width:100%;height:auto" role="img" aria-label="Line chart with a widening gap. The closed frontier rises faster than open weights, because the measured lag grew from three months in October 2025 to four by May 2026. Claude Opus 5.5 ships October 2026; open weights reach that level between March and June 2027. A 320B-class model fits one eight-GPU node, about 370 thousand dollars of GPU; the largest open model needs five nodes, about 1.85 million, and scored no better on the one index version where they can be compared.">
<rect width="1180" height="672" fill="#FFFFFF"/>
<text x="96" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1A1A1A">When do open weights reach today&#8217;s frontier — and which one would you run?</text>
<text x="96" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5A5A5A">The lag is <tspan font-style="italic">widening</tspan>: Epoch measured 3 months in Oct 2025 and 4 by May 2026, so the lines fan apart rather than running parallel.</text>
<text x="96" y="82" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5A5A5A">Horizontal distance is the measured quantity. The vertical scale is schematic — this answers <tspan font-style="italic">when</tspan>, not how much.</text>
<text x="96" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5A5A5A">The shaded band spans general capability to the harder domains Epoch breaks out separately.</text>
<line x1="96" y1="128" x2="96" y2="546" stroke="#E8E8E8" stroke-width="1"/>
<text x="96" y="568" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Jan 2025</text>
